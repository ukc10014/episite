<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>morbid symptoms</title>
  <script>
    window.MathJax = {
      tex: {
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      chtml: {
        displayAlign: 'left'  // this is the key setting
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>

    /* --- Keep Font Import --- */
    @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans&display=swap');

    @font-face {
      font-family: 'MyCustomFont';
      src: url('/SixtyfourConvergence-Regular-VariableFont_BLED,SCAN,XELA,YELA.ttf') format('truetype');
    }


    @keyframes svgPulse {
      0%, 100% {
        opacity: 0.95;
      }
      50% {
        opacity: 0.4;
      }
    }

    #angled-text {
      position: fixed;
      bottom: 400px;
      right: 50px;
      font-size: 108px;
      font-family: 'MyCustomFont', sans-serif;
      transform: rotate(-40deg);
      transform-origin: bottom right;
      color: white;
      z-index: -5; /* Below everything but above background */
      pointer-events: none; /* Don’t block clicks */
      opacity: 0.7; /* Optional: slightly ghostly */
    }


    #background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('Magellanic_Cloud.jpg') center center / cover no-repeat;
      z-index: -10; /* Sit below all other elements */
      background-repeat: repeat;               /* ← this is the key */
      background-size: auto;  
    }


    /* Bibliography list styling */
    .biblio-list {
      padding-left: 1.2em;           /* indent list */
      margin: 0.5em 0;
      list-style-type: disc;         /* bullets */
      /* list-style-type: "›"; */    /* or use a caret glyph */
    }

    .biblio-list li {
      margin-bottom: 0.4em;
      line-height: 1.4;
    }


    body, html {
      margin: 0;
      padding: 0;
      /* remove overflow: scroll; let content dictate scrolling */
      /* height: 100%; */ /* Optional: helps establish height context */
      font-family: 'Josefin Sans', sans-serif;
      /*background-color: #f8f8f8; /* Add a light background to body */
    }

    /* --- Remove SVG styles or adapt them --- */
    /* If keeping SVGs, they likely need different positioning now */
    /* .background-svg, .overlay-svg { ... } */

    #canvas {
      /* --- Remove fixed large dimensions --- */
      /* width: 200vw; */
      /* height: 200vh; */

      /* --- Use CSS Grid for layout --- */
      display: grid;
      grid-template-columns: repeat(2, minmax(300px, 1fr));
      grid-template-rows: repeat(2, auto);
      gap: 20px;

      /* --- Control overall canvas size and centering --- */
      width: 95%;
      max-width: 1600px;
      min-height: 80vh;
      margin: 20px auto;
      padding: 10px;
      box-sizing: border-box;

      /* --- !! IMPORTANT: Needed for absolute positioning of children !! --- */
      position: relative;
    }

    .fade-in-on-load {
      opacity: 0;
      transition: opacity 1.5s ease-in;
    }

    .fade-in-on-load.loaded {
      opacity: 1;
    }

    .math-left {
      text-align: left;
      margin-left: 2em;
    }


    /* ... other styles ... */

    .overlay-svg {
      position: absolute;
      top: 0;
      left: 0;
      /* --- !! Adjust size to fit the relative parent (canvas) !! --- */
      width: 100%;
      height: 100%;
      z-index: 10; /* Keep on top as it's an overlay */
      pointer-events: none;
      /* --- !! Add opacity to see through it !! --- */
      opacity: 0.15; /* Adjust value (0.0 to 1.0) as needed */
      object-fit: cover; /* Handle aspect ratio differences */
    }
    .invertible-svg {
      filter: invert(1) brightness(1.8) contrast(1.2);
      animation: svgPulse 1s ease-in-out infinite;
    }


    .quadrant {
      /* position: relative; */ /* Still needed for popup positioning */
      position: relative;
      /* --- Let Grid handle sizing, remove fixed sizes --- */
      /* width/height are now controlled by grid-template-columns/rows */

      /* --- Styling and Content Flow --- */
      padding: 15px 20px; /* Padding inside quadrants */
      box-sizing: border-box;
      border: 1px solid #ddd; /* Visually separate quadrants */
      background-color: #040000; /* Give quadrants a background */
      border-radius: 5px;
      /* --- Control Overflow --- */
      /* overflow-y: auto; */ /* REMOVE this - we want the quadrant ITSELF to grow */
      overflow: visible; /* Default, allows content to expand the container */

      /* Add a minimum height so they don't collapse entirely */
      min-height: 100px;

      /* Smooth transition for size changes (optional, might be subtle) */
      /* transition: height 0.4s ease; */ /* This might fight with max-height transition */
    }

    /* --- Keep Section Content Expansion Styles --- */
    .section-content {
      max-height: 0;
      /*overflow: visible !important;*/
      overflow: hidden;
      transition: max-height 0.4s ease-out; /* Keep transition */
      /* Add some padding/margin when expanded for spacing */
      padding-top: 0; /* Start padding at 0 */
      margin-top: 0;
      transition: max-height 0.4s ease-out, padding-top 0.4s ease-out, margin-top 0.4s ease-out; /* Transition padding too */
    }



    .section-content.expanded {
      /* Use a large enough value, or consider alternatives if content can be HUGE */
      max-height: 10000px; /* Increased max-height */
      /* Add space only when expanded */
      padding-top: 10px;
      margin-top: 5px; /* Small margin between header and expanded content */
    }

    
    .background-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 200vw;
      height: 200vh;
      z-index: 0;
      pointer-events: none;
    }

    .popup {
      position: relative;
      cursor: pointer;
      text-decoration: underline dotted;
    }

    .popup .popup-box {
      display: none;
      position: fixed;
      margin-bottom: 8px;

      /* styling */
      background: #373731;
      border: 1px solid #ccc;
      padding: 8px 10px;
      font-size: 0.95em;
      line-height: 1.4;
      z-index: 10;

      /* allow wrapping and arbitrary width */
      white-space: normal;
      word-wrap: break-word;
      max-width: 90ch;   /* ~90 characters–adjust as you like */
      /*max-height: none;
      overflow: visible;*/
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      border-radius: 4px;
    }

    .popup:hover .popup-box,
    .popup.show .popup-box {
      display: block;
    }

    /*.popup sup {
      font-size: 1em;
      vertical-align: super;
    }*/

    .popup::after {
      /* show above the reference marker */
      bottom: 100%;
      left: 0;
      margin-bottom: 8px;

      /* allow full HTML inside, not just plain-text */
      content: "";
      display: none;
      position: absolute;
      z-index: 1000;

      /* we’ll inject HTML via JS instead of content:attr() */
    }


    /*.popup:hover::after,
    .popup.show::after {
      display: block;
    }*/
    .text {
      font-size: 11pt; /* Adjusted base font size */
      line-height: 1.4; /* Adjusted line height */
      color: #d5fcdc;
    }

    .text p {
      margin-bottom: 1em; /* Standard spacing, adjust as needed */
      /* You could also use pixels (e.g., 16px) or other units */
    }

    .text h1, .text h2 {
      cursor: pointer;
      margin-top: 0; /* Remove default top margin */
      margin-bottom: 8px; /* Space below header */
      padding-bottom: 5px;
      /* border-bottom: 1px solid #eee; */ /* Optional separator */
      font-weight: normal; /* Using Josefin Sans, normal might look better */
      color: #d5fcdc;
    }
    .text h1 { font-size: 1.8em; color: #0cfb03;}
    .text h2 { font-size: 1.4em; color: #0cfb03;}

    #x11-buttons {
      position: fixed;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10001;
    }

    #x11-buttons button {
      font-family: 'MyCustomFont', monospace;
      background: #ccc;
      color: black;
      border: 2px outset #999;
      padding: 4px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    #x11-buttons button:active {
      border: 2px inset #999;
    }

    #x11-popup {
      display: none;
      position: fixed;
      top: 60px;
      left: 60px;
      width: 80vw;
      height: 70vh;
      background: #111;
      color: #0f0;
      border: 2px solid #999;
      padding: 10px;
      z-index: 10002;
      box-shadow: 0 0 10px #000;
      overflow: auto;
    }

    #x11-popup .x11-titlebar {
      font-family: 'MyCustomFont', monospace;
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
      text-align: right;
    }

    #x11-popup pre {
      font-family: monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 13px;
      line-height: 1.4;
    }
    
  </style>
</head>
<body>
  <div id="background-layer"></div>
  <div id="x11-buttons">
    <button data-file="epistle_faz.md">md version</button>
    <button data-file="README.md">readme</button>
  </div>
  
  <div id="x11-popup">
    <div class="x11-titlebar">[Tap/esc to Close]</div>
    <pre id="x11-content"></pre>
  </div>
  
  <div id="mobile-warning" style="
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 2px 2px;
    background: #222;
    color: #f60404;
    font-size: 0.85em;
    text-align: center;
    z-index: 10000;
    font-family: sans-serif;
  ">
    Best viewed on a desktop or tablet.
  </div>
  <div id="angled-text">morbid<br> symptoms</div>
  <div id="canvas" class="fade-in-on-load">
    <img src="shoggoth.svg" alt="Background" class="overlay-svg" />
    <div class="quadrant" id="q1">
      <div class="text" id="content1">Loading...</div>
    </div>
    <div class="quadrant" id="q2">
      <div class="text" id="content2">Loading...</div>
    </div>
    <div class="quadrant" id="q3">
      <div class="text" id="content3">Loading...</div>
    </div>
    <div class="quadrant" id="q4">
      <div class="text" id="content4">Loading...</div>
    </div>
  </div>
  <script>

    async function loadMarkdownSections() {
          try { // Optional: Add try/catch for better error handling
              const resp = await fetch('epistle_faz.md');
              if (!resp.ok) {
                  console.error("Failed to load markdown:", resp.statusText);
                  // Display error message in quadrants
                  document.getElementById('content1').innerHTML = 'Error loading content.';
                  document.getElementById('content2').innerHTML = 'Error loading content.';
                  document.getElementById('content3').innerHTML = 'Error loading content.';
                  document.getElementById('content4').innerHTML = 'Error loading content.';
                  return;
              }
              const text = await resp.text();
              const noStrike = text.replace(/~~.*?~~/gs, ''); // Example: Keep this

              // --- !! Restore FULL footnote parsing !! ---
              const footnotePairs = {};
              const footnotes = [...text.matchAll(/\[\^(\d+)\]:\s*((?:[^\n]+(?:\n(?!\[\^\d+\]:).*)*)+)/g)];
              footnotes.forEach(match => {
                  footnotePairs[match[1]] = match[2].trim();
              });
              // --- !! END Restore ---

              // --- !! Restore FULL bibliography parsing !! ---
              const biblioMatch = text.match(/##\s*(?:sources|bibliography)[\s\S]*/i);
              let biblio = biblioMatch ? biblioMatch[0].trim() : '';
              const biblioRefs = {};
              biblio.split(/\n(?=[A-Z][a-z]+ \d{4})/).forEach(entry => {
                  const label = entry.match(/^([A-Z][a-z]+ \d{4})/);
                  if (label) biblioRefs[label[1]] = entry.trim();
              });
              // --- !! END Restore ---

              // --- !! Restore FULL bodyOnly creation and cleanup !! ---
              let bodyOnly = noStrike
                .replace(/\[\^\d+\]:.*(?:\n(?!\[\^\d+\]:).*)*/g, '')  // remove footnotes definitions
                .replace(/##\s*(?:sources|bibliography)[\s\S]*/i, '');

              // Replace references with popups (ensure this uses the populated footnotePairs and biblioRefs)
              bodyOnly = bodyOnly.replace(/\[\^(\d+)\]/g, (match, number) => {
                const note = footnotePairs[number];
                return note ? `<span class="popup" data-note="${note.replace(/"/g, '&quot;')}"><sup>[${number}]</sup></span>` : match;
              });
              bodyOnly = bodyOnly.replace(/\b([A-Z][a-z]+ \d{4})\b/g, (match) => {
                const note = biblioRefs[match];
                return note ? `<span class="popup" data-note="${note.replace(/"/g, '&quot;')}">${match}</span>` : match;
              });
              // --- !! END Restore ---

              // --- !! ADD THIS LINE HERE !! ---
              // Remove all asterisks after other processing
              bodyOnly = bodyOnly.replace(/\*/g, "");
              // --- !! END ADDITION !! ---

              // Do the pop-up anchors
              bodyOnly = bodyOnly.replace(
                /<span class="popup"([^>]*)>([\s\S]*?)<\/span>/g,
                (_, attrs, inner) => {
                  // sanitize your note text as before…
                  const note = attrs
                    .match(/data-note="([^"]*)"/)[1]
                    .replace(/\r?\n+/g, ' ')
                    .trim();

                  // inject a <span> not a <div>
                  return `<span class="popup"${attrs}>`
                      +  `${inner}`
                      +  `<span class="popup-box">${note}</span>`
                      +  `</span>`;
                }
              );





              // --- Group content into sections ---
              // This part should now work correctly as bodyOnly is populated
              const lines = bodyOnly.split('\n');
              const sections = [];
              let current = null;
              lines.forEach(line => {
                const h1 = line.match(/^# (.*)/);
                const h2 = line.match(/^## (.*)/);
                if (h1 || h2) {
                  if (current) sections.push(current);
                  current = {
                    title: h1 ? h1[1].trim() : h2[1].trim(),
                    level: h1 ? 'h1' : 'h2',
                    body: []
                  };
                } else if (current && line.trim()) { // Only add non-empty lines to body
                  current.body.push(line); // Keep original spacing info for <br> conversion
                }
              });
              if (current) sections.push(current);

              // --- insert bibliography section after "SteelSofont, our case" ---
              if (biblio) {
                const rawBiblio = biblioMatch ? biblioMatch[0].trim() : '';

                const biblioLines = rawBiblio
                  .replace(/^##\s*(?:sources|bibliography)\s*/i, '')
                  .split('\n')
                  .filter(l => l.trim())
                  .map(entry =>
                    entry
                      // 1) convert Markdown links
                      .replace(
                        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                        '<a href="$2" target="_blank" rel="noopener">$1</a>'
                      )
                      // 2) convert any remaining bare URLs
                      .replace(
                        /(https?:\/\/[^\s<]+)/g,
                        '<a href="$1" target="_blank" rel="noopener">$1</a>'
                      )
                  );

                const biblioSection = {
                  title: 'sources',
                  level: 'h2',
                  body: biblioLines
                };
                const idx = sections.findIndex(s =>
                  /steels? ofont/i.test(s.title)
                );
                if (idx >= 0) sections.splice(idx + 1, 0, biblioSection);
                else sections.push(biblioSection);
              }
              // --- end injection ---


              // --- Build HTML sections ---
              // This part should work correctly now
              /*const htmlSections = sections.map(({ title, level, body }) => {
                const bodyHtml = body
                    .join('\n') // Join lines preserving single newlines
                    .split(/\n{2,}/) // Split into paragraphs on double+ newlines
                    .map(p => p.trim())
                    .filter(p => p) // Remove empty paragraphs
                    // Replace single newlines within paragraphs with <br> before wrapping in <p>
                    .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                    .join('');
                return `<${level}>${title}</${level}><div class="section-content">${bodyHtml}</div>`;
              });*/

              const htmlSections = sections.map(({ title, level, body }) => {
                let bodyHtml;
                if (/^sources$|^bibliography$/i.test(title)) {
                  bodyHtml = `<ul class="biblio-list">` +
                    body.map(entry => `<li>${entry}</li>`).join('') +
                    `</ul>`;
                } else {
                  bodyHtml = body
                    .join('\n')
                    .split(/\n{2,}/)
                    .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
                    .join('');
                }
                return `<${level}>${title}</${level}><div class="section-content">${bodyHtml}</div>`;
              });




              // --- Distribute into quadrants ---
              // This part should work correctly now
              const quarter = Math.ceil(htmlSections.length / 4);
              document.getElementById('content1').innerHTML = htmlSections.slice(0, quarter).join('');
              document.getElementById('content2').innerHTML = htmlSections.slice(quarter, 2 * quarter).join('');
              document.getElementById('content3').innerHTML = htmlSections.slice(2 * quarter, 3 * quarter).join('');
              document.getElementById('content4').innerHTML = htmlSections.slice(3 * quarter).join('');

              // --- Add toggle behavior ---
              // This part remains the same
              document.querySelectorAll('#canvas h1, #canvas h2').forEach(header => {
                header.addEventListener('click', () => {
                  const section = header.nextElementSibling;
                  if (section && section.classList.contains('section-content')) {
                    const wasExpanded = section.classList.contains('expanded');
                    section.classList.toggle('expanded');
                    // Scroll header into view if it was just expanded
                    if (!wasExpanded) {
                      // Use timeout to allow layout to recalculate AFTER max-height transition starts
                      setTimeout(() => {
                            header.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                      }, 50); // Adjust delay if needed
                    }
                  }
                });
              });
          } catch (error) {
              console.error("Error loading or processing markdown:", error);
              // Display error message in quadrants
                document.getElementById('content1').innerHTML = 'Error processing content.';
                document.getElementById('content2').innerHTML = 'Error processing content.';
                document.getElementById('content3').innerHTML = 'Error processing content.';
                document.getElementById('content4').innerHTML = 'Error processing content.';
          }

          if (window.MathJax) {
            MathJax.typeset(); // trigger MathJax to re-render the new math
          }

        } // end loadMarkdownSections

        function positionPopupBox(popup) {
          const box = popup.querySelector('.popup-box');
          if (!box) return;

          const margin = 8;  
          const rect = popup.getBoundingClientRect();
          const boxW = box.offsetWidth;
          const boxH = box.offsetHeight;
          const vw = window.innerWidth;
          const vh = window.innerHeight;

          // try to place above
          let top = rect.top - boxH - margin;
          if (top < margin) {
            // not enough room above → drop below
            top = rect.bottom + margin;
          }

          // align left, but shift left if it overflows right edge
          let left = rect.left;
          if (left + boxW + margin > vw) {
            left = vw - boxW - margin;
          }

          box.style.top  = `${top}px`;
          box.style.left = `${left}px`;
        }

        // toggle & position on click
        document.addEventListener('click', e => {
          const p = e.target.closest('.popup');
          if (p) {
            e.preventDefault();
            // close others
            document.querySelectorAll('.popup.show').forEach(o => {
              if (o !== p) o.classList.remove('show');
            });
            // toggle this one
            p.classList.toggle('show');
            if (p.classList.contains('show')) {
              positionPopupBox(p);
            }
          } else {
            // click outside → close all
            document.querySelectorAll('.popup.show').forEach(o => o.classList.remove('show'));
          }
        });

        const popup = document.getElementById('x11-popup');
        const content = document.getElementById('x11-content');

        document.querySelectorAll('#x11-buttons button').forEach(btn => {
          btn.addEventListener('click', async () => {
            const file = btn.dataset.file;
            try {
              console.log(file);
              const resp = await fetch(file);
              console.log(resp);
              const text = await resp.text();
              content.textContent = text;
              popup.style.display = 'block';
            } catch (err) {
              content.textContent = `Error loading ${file}`;
              popup.style.display = 'block';
            }
          });
        });

        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            popup.style.display = 'none';
          }
        });

        // So we can close the pop-ups on mobile
        document.addEventListener('click', (e) => {
          if (
            popup.style.display === 'block' &&
            !popup.contains(e.target) &&
            !e.target.closest('#x11-buttons')
          ) {
            popup.style.display = 'none';
          }
        });

        document.querySelector('#x11-popup .x11-titlebar').addEventListener('click', () => {
          popup.style.display = 'none';
        });




        // reposition if the user scrolls or resizes
        window.addEventListener('scroll',   () => document.querySelectorAll('.popup.show').forEach(positionPopupBox));
        window.addEventListener('resize',   () => document.querySelectorAll('.popup.show').forEach(positionPopupBox));

        window.addEventListener('load', () => {
          setTimeout(() => {
            document.querySelector('#canvas').classList.add('loaded');
          }, 1000); // 1 second delay
        });


        window.addEventListener('load', loadMarkdownSections);

        function isMobileDevice() {
          return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        window.addEventListener('load', () => {
          if (isMobileDevice()) {
            document.getElementById('mobile-warning').style.display = 'block';
            // optionally bump the body down to avoid covering content
            document.body.style.paddingTop = '10px';
          }
        });


  </script>
</body>
</html>
